# cargo-deny configuration.
#
# `cargo audit` covers RustSec advisories. This file covers what it does not:
# license compliance, where crates are allowed to come from, and structural
# hygiene of the dependency graph. It matters more here than in the Apache-2.0
# crates: this tree is redistributed under the Business Source License, so a
# copyleft dependency reaching it is a licensing problem rather than a note in a
# NOTICE file. Every licence below is permissive, which is what makes
# distributing this at all possible, and what will keep it possible when each
# version converts to Apache-2.0 on its Change Date.
#
# Every list below was derived from an actual run over this lockfile, not copied
# from the sibling repository. Re-derive rather than guess when adding a
# dependency:
#
#   cargo deny --all-features list
#   cargo deny --all-features check

[graph]
all-features = true

[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
# A yanked crate is a supply-chain signal in its own right, so it fails here
# even when no advisory has been filed against it. Both of this tree's known
# offenders - rustls below 0.23.45 and chacha20 0.10.1 - were caught this way.
yanked = "deny"
ignore = []

[licenses]
# The complete set required to satisfy every SPDX expression in the tree.
#
# Note what is NOT here: `LGPL-2.1-or-later` appears in a `cargo deny list` of
# this tree, via `r-efi`, and looks alarming for a proprietary service. It is a
# disjunction - `MIT OR Apache-2.0 OR LGPL-2.1-or-later` - so MIT satisfies it
# and no copyleft obligation attaches. Leaving LGPL out of this list is
# deliberate: if a dependency ever arrives offering copyleft as the *only*
# option, this check has to fail rather than wave it through.
allow = [
    "Apache-2.0",          # the bulk of the tree
    "MIT",                 # the bulk of the tree
    "ISC",                 # rustls, rustls-webpki, ring, untrusted, hyper-rustls
    "BSD-3-Clause",        # matchit, subtle
    "BSD-2-Clause",        # zerocopy
    "BSL-1.0",             # ryu, wasite, whoami
    "CDLA-Permissive-2.0", # webpki-roots
    "Unicode-3.0",         # the icu_* family, reached through idna/url
    "Zlib",                # foldhash, tinyvec
    "Unlicense",           # byteorder, memchr, each offered alongside MIT
]
confidence-threshold = 0.93
# Scoped to this crate by name, deliberately. BUSL-1.1 is what *this* is
# licensed under; it is not something a dependency may arrive carrying. Putting
# it in `allow` above would say the opposite and weaken the one list whose whole
# job is policing what we take on.
exceptions = [{ crate = "mcp-usage-plane", allow = ["BUSL-1.1"] }]

# This crate is published now, so it is no longer private and this setting does
# not cover it. Its licence is handled by the `exceptions` entry above, which
# allows BUSL-1.1 for this crate by name and for nothing else. The setting stays
# because it costs nothing and would apply again to any unpublished member.
[licenses.private]
ignore = true

[bans]
# A warning rather than an error: the resolved graph carries duplicated crates
# it does not control, mostly the windows-sys/windows-targets target shims and
# the getrandom/rand_core/hashbrown families. Failing the build on those would
# only get this check switched off. Tighten once they resolve upstream.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
# Everything must come from crates.io. A git or vendored source appearing here
# would mean a dependency was redirected somewhere unreviewed - and this tree
# handles customer billing credentials.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
