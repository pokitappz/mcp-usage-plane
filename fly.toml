# fly secrets set DATABASE_URL='postgres://...aivencloud.com:.../defaultdb?sslmode=require'

app = 'mcp-usage-plane'
primary_region = 'yyz'

[build]

# Default is 5s. Gives the shutdown path room to drain the pool so an in-flight
# usage transaction commits rather than being cut off, which for the ledger is
# the difference between a retryable batch and a lost one.
kill_timeout = '15s'

[http_service]
  internal_port = 8081
  force_https = true
  # Sidecars poll this on a short interval and fail closed once their snapshot
  # ages out, so a cold start in that path is a customer-visible outage.
  auto_stop_machines = false
  auto_start_machines = false
  min_machines_running = 0
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    soft_limit = 64
    hard_limit = 128

  # Without this block Fly falls back to a TCP connect probe, so an instance
  # that is listening but cannot reach Postgres stays in rotation - which is
  # the exact failure `/healthz` was written to catch. The handler caches its
  # probe for two seconds, so a five second interval costs one query per poll
  # rather than one per request.
  [[http_service.checks]]
    interval = '5s'
    timeout = '2s'
    grace_period = '10s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  memory = '512mb'
  cpus = 1
