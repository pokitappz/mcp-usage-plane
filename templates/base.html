<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ shell.title }}</title>
<meta name="description" content="{{ shell.description }}">
<meta name="robots" content="{{ shell.robots }}">
<link rel="canonical" href="{{ shell.canonical }}">
<link rel="stylesheet" href="/assets/usagekit.css">
<link rel="icon" href="/assets/mark.svg" type="image/svg+xml">
<meta name="color-scheme" content="light dark">
<meta property="og:type" content="website">
<meta property="og:title" content="{{ shell.title }}">
<meta property="og:description" content="{{ shell.description }}">
<meta property="og:url" content="{{ shell.canonical }}">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>

<header class="masthead">
  <div class="wrap masthead-inner">
    <a class="wordmark" href="/">
      <span class="wordmark-name">{{ shell.product.name }}</span>{% if !shell.product.suffix.is_empty() %}<span class="wordmark-suffix">{{ shell.product.suffix }}</span>{% endif %}
    </a>
    <nav class="nav" aria-label="Primary">
      <a class="nav-cta" href="/app">Sign in</a>
    </nav>
  </div>
</header>

<main id="main">
{% block main %}{% endblock %}
</main>

<footer class="footer">
  <div class="wrap footer-inner">
    <div class="footer-block">
      <p class="footer-name">{{ shell.product.full() }}</p>
      <p class="footer-note">Usage billing for MCP servers.</p>
    </div>
  </div>
</footer>
</body>
</html>
