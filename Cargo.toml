[workspace]
resolver = "3"
members = ["sqlx-postgres-only"]

[package]
name = "mcp-usage-plane"
description = "Usage and entitlement control plane for MCP servers."
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
# Source-available under the Business Source License 1.1. Non-production use is
# free; production use needs a subscription; each version becomes Apache-2.0 on
# its Change Date, four years out.
#
# The SPDX identifier, with the terms in LICENSE.md beside it. BUSL requires a
# licensor to fill in its Parameters, so the bare identifier is the accurate
# name for the licence and the file is where what it grants is written.
license = "BUSL-1.1"
readme = "README.md"
repository = "https://github.com/pokitappz/mcp-usage-plane"
keywords = ["mcp", "billing", "metering", "usage", "stripe"]
categories = ["web-programming::http-server", "database"]

# The published archive carries what is needed to build and run, and nothing
# else. `templates`, `migrations` and `static` are build inputs rather than
# extras: the templates are compiled in by Askama, the migrations by
# `sqlx::migrate!`, and the stylesheet by `include_bytes!`, so leaving any of
# them out produces a package that does not compile.
include = [
    "src/**/*",
    "migrations/*.sql",
    "templates/*.html",
    "static/assets/*",
    "Cargo.toml",
    "LICENSE.md",
    "README.md",
]

# The paid product, though now a readable one. It depends on the Apache-2.0
# crates from crates.io rather than by path, which keeps the open-core boundary
# honest: if the published crates are not enough to build a control plane,
# anyone metering with the free proxy would hit the same wall.
[dependencies]
mcp-usage-core = "0.4.0"
mcp-usage-export = "0.4.0"

# `form` is for the landing page: the request-access and dashboard forms are
# real HTML posts rather than fetches, so they work with JavaScript disabled.
axum = { version = "0.8.9", default-features = false, features = ["form", "http1", "json", "query", "tokio"] }
tokio = { version = "1.53.0", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
# `fs` serves the stylesheet. Note that `ServeDir` resolves against the process
# working directory, not the crate root, which is why the Dockerfile copies
# `static/` next to the binary.
tower-http = { version = "0.6.8", default-features = false, features = ["limit", "timeout", "trace"] }

# Compile-time HTML templates: a typo in a template is a build failure rather
# than a 500 in front of a customer, and there is no runtime template loading to
# get wrong in a container.
askama = "0.16"

# Not the `sqlx` umbrella crate. Depending on it puts every optional driver
# into Cargo.lock whatever features are selected, which means MySQL, which means
# `rsa` and its open advisory. `cargo audit` reads the lockfile, so the tree
# looking clean to `cargo tree` is not the same as being clean.
#
# `version` as well as `path` so this resolves from crates.io when published and
# from here when developing.
sqlx = { package = "plane-sqlx-postgres", version = "0.1.0", path = "sqlx-postgres-only" }

serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
chrono = { version = "0.4.42", default-features = false, features = ["clock", "serde", "std"] }

sha2 = "0.11.0"
base64 = "0.23.0"
getrandom = "0.3.4"
hmac = "0.13.0"
# Customer billing credentials are sealed at rest with the same AEAD and the same
# `enc:<base64(nonce||ciphertext)>` envelope Backstock uses for POS tokens, so
# there is one shape of sealed secret across the studio.
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc", "getrandom"] }
# rustls, never OpenSSL. No redirects: following a 3xx would carry a billing
# credential to a host the allowlist never checked.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Already in the tree through reqwest. Named explicitly because `Url::host`
# returns `url::Host`, which is the only API that parses an IPv6 literal
# rather than handing back a bracketed string.
url = "2.5"

thiserror = "2.0.18"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.20", default-features = false, features = ["env-filter", "fmt", "std"] }

[dev-dependencies]
tokio-test = "0.4"
# Already in the graph as normal dependencies. The export suite needs them to
# seal a credential the way the service does, so it can plant a valid row
# holding the wrong kind of key and prove the provider still refuses it.
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc", "getrandom"] }
base64 = "0.23.0"
axum = { version = "0.8.9", default-features = false, features = ["form", "http1", "json", "query", "tokio"] }

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
overflow-checks = true
