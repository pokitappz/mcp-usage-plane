[workspace]
resolver = "3"
members = ["sqlx-postgres-only"]

[package]
name = "mcp-usage-plane"
description = "Hosted usage and entitlement control plane for MCP servers."
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

# The paid product. It depends on the Apache-2.0 crates from crates.io rather
# than by path, which keeps the open-core boundary honest: if the published
# crates are not enough to build a control plane, customers self-hosting the
# free sidecar would hit the same wall.
[dependencies]
mcp-usage-core = "0.4.0"
mcp-usage-export = "0.4.0"

axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio"] }
tokio = { version = "1.53.0", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "0.6.8", default-features = false, features = ["limit", "timeout", "trace"] }

sqlx = { package = "plane-sqlx-postgres", path = "sqlx-postgres-only" }

serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
chrono = { version = "0.4.42", default-features = false, features = ["clock", "serde", "std"] }

sha2 = "0.11.0"
base64 = "0.23.0"
getrandom = "0.3.4"
hmac = "0.13.0"
# Customer billing credentials are sealed at rest with the same AEAD and the same
# `enc:<base64(nonce||ciphertext)>` envelope Backstock uses for POS tokens, so
# there is one shape of sealed secret across the studio.
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc", "getrandom"] }
# rustls, never OpenSSL. No redirects: following a 3xx would carry a billing
# credential to a host the allowlist never checked.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Already in the tree through reqwest. Named explicitly because `Url::host`
# returns `url::Host`, which is the only API that parses an IPv6 literal
# rather than handing back a bracketed string.
url = "2.5"

thiserror = "2.0.18"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.20", default-features = false, features = ["env-filter", "fmt", "std"] }

[dev-dependencies]
tokio-test = "0.4"
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio"] }

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
overflow-checks = true
